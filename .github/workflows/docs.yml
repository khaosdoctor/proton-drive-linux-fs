name: docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material
      - run: mkdocs build --strict

      - name: include APT repository
        continue-on-error: true
        run: |
          git fetch origin apt-repo:apt-repo 2>/dev/null || exit 0
          git worktree add /tmp/apt-repo apt-repo
          mkdir -p site/apt
          cp -r /tmp/apt-repo/pool /tmp/apt-repo/dists site/apt/
          # Include the GPG public key if it was generated
          [ -f /tmp/apt-repo/public.key ] && cp /tmp/apt-repo/public.key site/apt/
          git worktree remove /tmp/apt-repo

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
