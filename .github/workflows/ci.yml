name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'perf/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          # Same as the Makefile, built with this Go like `go run` does: "latest" broke CI with a new
          # false positive, and the prebuilt v2.13.2 can't read Go 1.27's export data.
          version: v2.13.2
          install-mode: goinstall

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build .

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y desktop-file-utils appstream
      - run: desktop-file-validate contrib/proton-drive-fs.desktop
      - run: appstreamcli validate --no-net contrib/*.metainfo.xml
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          install-only: true
      - name: goreleaser check
        run: goreleaser check || [ $? -eq 2 ]
