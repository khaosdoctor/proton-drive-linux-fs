name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Bumps from conventional commits: feat -> minor, fix/perf -> patch, BREAKING CHANGE -> major.
      # default_bump=false means chore/docs/ci-only pushes create no tag and no release.
      - id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false

      - if: steps.tag.outputs.new_tag != '' && steps.tag.outputs.new_tag != steps.tag.outputs.previous_tag
        run: git fetch --tags --force

      - if: steps.tag.outputs.new_tag != '' && steps.tag.outputs.new_tag != steps.tag.outputs.previous_tag
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - if: steps.tag.outputs.new_tag != '' && steps.tag.outputs.new_tag != steps.tag.outputs.previous_tag
        uses: docker/setup-qemu-action@v3

      - if: steps.tag.outputs.new_tag != '' && steps.tag.outputs.new_tag != steps.tag.outputs.previous_tag
        uses: docker/setup-buildx-action@v4

      - if: steps.tag.outputs.new_tag != '' && steps.tag.outputs.new_tag != steps.tag.outputs.previous_tag
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.tag.outputs.new_tag != '' && steps.tag.outputs.new_tag != steps.tag.outputs.previous_tag
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
