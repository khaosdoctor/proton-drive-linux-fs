version: 2

builds:
  - main: ./cmd/proton-drive-fs
    binary: proton-drive-fs
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}}

archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - contrib/**

nfpms:
  - id: proton-drive-fs
    package_name: proton-drive-fs
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: khaosdoctor
    homepage: https://github.com/khaosdoctor/proton-drive-linux-fs
    maintainer: Lucas Santos <hello@lsantos.dev>
    description: FUSE virtual filesystem for Proton Drive on Linux.
    license: MIT
    formats:
      - deb
      - rpm
      - apk
      - archlinux
    dependencies:
      - fuse3
    recommends:
      - zenity
    contents:
      - src: contrib/proton-drive-fs.desktop
        dst: /usr/share/applications/proton-drive-fs.desktop
      - src: contrib/icons/proton-drive-fs.png
        dst: /usr/share/icons/hicolor/64x64/apps/proton-drive-fs.png
      - src: contrib/systemd/proton-drive-fs.service
        dst: /usr/lib/systemd/user/proton-drive-fs.service
      - src: contrib/systemd/proton-drive-fs-tray.service
        dst: /usr/lib/systemd/user/proton-drive-fs-tray.service
      - src: contrib/io.github.khaosdoctor.proton_drive_fs.metainfo.xml
        dst: /usr/share/metainfo/io.github.khaosdoctor.proton_drive_fs.metainfo.xml
      - src: LICENSE
        dst: /usr/share/licenses/proton-drive-fs/LICENSE
        type: doc
    scripts:
      postinstall: contrib/packaging/postinstall.sh

checksum:
  name_template: "checksums.txt"

dockers:
  - image_templates:
      - "ghcr.io/khaosdoctor/proton-drive-linux-fs:{{ .Version }}-amd64"
      - "ghcr.io/khaosdoctor/proton-drive-linux-fs:latest-amd64"
    use: buildx
    dockerfile: Dockerfile.goreleaser
    goarch: amd64
    build_flag_templates:
      - "--platform=linux/amd64"
  - image_templates:
      - "ghcr.io/khaosdoctor/proton-drive-linux-fs:{{ .Version }}-arm64"
      - "ghcr.io/khaosdoctor/proton-drive-linux-fs:latest-arm64"
    use: buildx
    dockerfile: Dockerfile.goreleaser
    goarch: arm64
    build_flag_templates:
      - "--platform=linux/arm64"

docker_manifests:
  - name_template: "ghcr.io/khaosdoctor/proton-drive-linux-fs:{{ .Version }}"
    image_templates:
      - "ghcr.io/khaosdoctor/proton-drive-linux-fs:{{ .Version }}-amd64"
      - "ghcr.io/khaosdoctor/proton-drive-linux-fs:{{ .Version }}-arm64"
  - name_template: "ghcr.io/khaosdoctor/proton-drive-linux-fs:latest"
    image_templates:
      - "ghcr.io/khaosdoctor/proton-drive-linux-fs:latest-amd64"
      - "ghcr.io/khaosdoctor/proton-drive-linux-fs:latest-arm64"

changelog:
  use: github-native
